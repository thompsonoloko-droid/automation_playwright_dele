name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Basic validation
          if [ -z "$COMMIT_MSG" ]; then
            echo "❌ Commit message is empty"
            exit 1
          fi

          # Check for conventional commits
          if ! echo "$COMMIT_MSG" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?!?:"; then
            echo "⚠️  Commit message doesn't follow conventional commits"
            echo "Example: feat(tests): add new test case"
          fi

      - name: Check file changes
        run: |
          echo "Files changed:"
          git diff --name-only origin/main...HEAD

          # Check if sensitive files were modified
          if git diff --name-only origin/main...HEAD | grep -E "\.env|secrets|credentials"; then
            echo "❌ Sensitive files detected - remove before pushing"
            exit 1
          fi

  smoke-test:
    name: Smoke Tests (PR)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run smoke tests
        run: |
          pytest tests/ -m smoke \
            --browser=chromium \
            -v \
            --tb=short \
            --html=reports/smoke-test-pr.html \
            --self-contained-html \
            --junitxml=reports/junit-smoke-pr.xml
        continue-on-error: true

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: reports/

  test-coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run coverage check
        run: |
          pytest tests/ \
            --cov=pages \
            --cov=utils \
            --cov-report=term:missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -q
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: pr-tests
        continue-on-error: true

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install black flake8 isort pylint

      - name: Format check
        run: black --check tests/ pages/ utils/ 2>&1 | head -20
        continue-on-error: true

      - name: Lint check
        run: flake8 tests/ pages/ utils/ --count --max-line-length=120
        continue-on-error: true

      - name: Import sort check
        run: isort --check-only tests/ pages/ utils/
        continue-on-error: true

  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [validate, smoke-test, test-coverage, code-quality]
    if: always()

    steps:
      - name: Create summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = "## PR Quality Report\n\nAll automated checks have been completed.\n\n✅ File Validation\n✅ Smoke Tests\n✅ Coverage Check\n✅ Code Quality\n\nReady to merge once all checks pass! 🚀";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
