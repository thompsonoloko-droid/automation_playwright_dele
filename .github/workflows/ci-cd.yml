# Minimal, valid GitHub Actions CI/CD workflow for automation_playwright_dele
name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.14.2'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy pre-commit
          python -m playwright install
      - name: Run tests
        run: pytest tests/ --alluredir=reports/allure-results --html=reports/test-report.html --self-contained-html
      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline --save-dev
      - name: Generate Allure Report
        run: |
          allure generate reports/allure-results -o reports/allure-report --clean
      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/test-report.html
      - name: Lint and Type Check
        run: |
          black .
          ruff format .
          ruff check .
          mypy . --ignore-missing-imports || true
      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true
      - name: Clean up Playwright
        run: python -m playwright uninstall
