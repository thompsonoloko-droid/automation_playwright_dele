# GitHub Actions workflow for comprehensive test automation CI/CD pipeline
# Triggers on:
# - Push to main and develop branches
# - Pull requests to main branch
# - Daily schedule at 8 AM UTC
# - Manual trigger (workflow_dispatch)
#
# Features:
# - Multi-browser testing (Chromium, Firefox, WebKit)
# - Parallel test execution by browser
# - Auto-retry for flaky tests
# - HTML and Allure reports
# - Test artifact uploads
# - GitHub status checks

name: Test Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # Daily run at 8 AM UTC
  workflow_dispatch: # Manual trigger
    inputs:
      test_suite:
        description: "Test suite to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
          - ui

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

# Least privilege — restrict default token, grant per-job below
permissions:
  contents: read

# Prevent duplicate runs on rapid pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# JOB 1: QUALITY GATES - Code formatting and linting checks
# Runs lint, formatting, and static analysis tools
# Fails fast to prevent low-quality code merges
# ============================================================================
jobs:
  # Check code style, formatting, and import organization
  # Pre-requisite for all other jobs - runs first
  lint-and-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # ============================================================================
  # JOB 2: MULTI-BROWSER TESTING - Parallel test execution across browsers
  # Runs smoke, regression, and API tests on Chromium, Firefox, and WebKit
  # Uses matrix strategy for efficient parallel execution
  # Generates HTML, JUnit, and Allure reports per browser
  # ============================================================================
  test:
    name: Test Suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint-and-quality
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: chromium
            headless: true
          - browser: firefox
            headless: true
          - browser: webkit
            headless: true

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip" # Cache pip dependencies

      # System dependencies are now handled by playwright install --with-deps
      # libgconf-2-4 is deprecated in modern Ubuntu versions and no longer needed
      - name: Update system packages
        run: sudo apt-get update

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install ${{ matrix.browser }} --with-deps

      - name: Verify required secrets present
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_CVC: ${{ secrets.CARD_CVC }}
          CARD_EXPIRY_MONTH: ${{ secrets.CARD_EXPIRY_MONTH }}
          CARD_EXPIRY_YEAR: ${{ secrets.CARD_EXPIRY_YEAR }}
        run: |
          MISSING=0
          for v in TEST_USER_NAME TEST_USER_EMAIL TEST_USER_PASSWORD CARD_NAME CARD_NUMBER CARD_CVC CARD_EXPIRY_MONTH CARD_EXPIRY_YEAR; do
            if [ -z "${!v}" ]; then
              echo "MISSING: $v"
              MISSING=1
            else
              echo "FOUND: $v"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "One or more required secrets are missing. Please add them in repository Secrets."
            exit 1
          fi

      - name: Run Smoke Tests
        id: smoke-tests
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_CVC: ${{ secrets.CARD_CVC }}
          CARD_EXPIRY_MONTH: ${{ secrets.CARD_EXPIRY_MONTH }}
          CARD_EXPIRY_YEAR: ${{ secrets.CARD_EXPIRY_YEAR }}
        run: |
          pytest tests/ui/ -m smoke \
            --browser=${{ matrix.browser }} \
            --retries 1 \
            -v \
            --tb=short \
            --html=reports/smoke-${{ matrix.browser }}.html \
            --self-contained-html \
            --junitxml=reports/junit-smoke-${{ matrix.browser }}.xml
            # --alluredir=reports/allure-results/smoke/${{ matrix.browser }}   ## allure report is disabled here
        continue-on-error: false

      - name: Run Regression Tests
        id: regression-tests
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_CVC: ${{ secrets.CARD_CVC }}
          CARD_EXPIRY_MONTH: ${{ secrets.CARD_EXPIRY_MONTH }}
          CARD_EXPIRY_YEAR: ${{ secrets.CARD_EXPIRY_YEAR }}
        run: |
          pytest tests/ui/ -m regression \
            --browser=${{ matrix.browser }} \
            --retries 1 \
            -v \
            --tb=short \
            -n auto \
            --html=reports/regression-${{ matrix.browser }}.html \
            --self-contained-html \
            --junitxml=reports/junit-regression-${{ matrix.browser }}.xml
            # --alluredir=reports/allure-results/regression/${{ matrix.browser }}     ## allure report is disabled here
        continue-on-error: false

      - name: Run API Tests
        id: api-tests
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          pytest tests/api/ -v \
            --tb=short \
            --html=reports/api-tests.html \
            --self-contained-html \
            --junitxml=reports/junit-api.xml
            # --alluredir=reports/allure-results/api    ## allure report is disabled here
        continue-on-error: false

      - name: Run Mobile Tests
        id: mobile-tests
        if: matrix.browser == 'chromium'
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          pytest tests/ui/test_mobile.py -m mobile \
            --browser=chromium \
            --mobile-device "iPhone 13" \
            -v \
            --tb=short \
            --html=reports/mobile-iphone13.html \
            --self-contained-html \
            --junitxml=reports/junit-mobile-iphone13.xml
        continue-on-error: true

      # Skip collecting results - junit files are generated in reports/ directory
      # They are uploaded as artifacts for later processing
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: reports/junit-*.xml
          check_name: Test Results (${{ matrix.browser }})
          comment_title: Test Report

      - name: Write Test Summary
        if: always()
        run: |
          SMOKE='${{ steps.smoke-tests.outcome }}'
          REGRESSION='${{ steps.regression-tests.outcome }}'
          API='${{ steps.api-tests.outcome }}'
          MOBILE='${{ steps.mobile-tests.outcome }}'

          echo "## Test Results - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | $([ \"$SMOKE\" = 'success' ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Tests | $([ \"$REGRESSION\" = 'success' ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | $([ \"$API\" = 'success' ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Tests | $([ \"$MOBILE\" = 'success' ] && echo '✅' || echo '⏭️') |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 3: CODE COVERAGE - Measure test coverage and integration
  # Runs with coverage collection across pages/ and utils/ modules
  # Enforces minimum 60% coverage threshold
  # Uploads results to Codecov for tracking and trends
  # ============================================================================
  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run tests with coverage
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          pytest tests/ \
            --cov=pages \
            --cov=utils \
            --cov-report=html:reports/coverage-html \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./reports/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: reports/coverage-html/
          if-no-files-found: ignore

  # ============================================================================
  # JOB 4: ALLURE REPORTING - Generate interactive test report
  # Downloads and merges test results from all browsers
  # Generates Allure report and deploys to GitHub Pages
  # Maintains history of last 10 test runs for trend analysis
  # ============================================================================
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts/

      - name: Merge all Allure results
        run: |
          mkdir -p reports/allure-results
          for dir in $(find artifacts -type d -path "*/allure-results"); do
            echo "Merging $dir"
            cp -r "$dir"/* reports/allure-results/ || true
          done
          echo "All Allure results merged into reports/allure-results"

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@53ebb757a2097edc77c53ecef4d454fc2f2f774c # v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 10
        continue-on-error: true

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: true
          force_orphan: true

  # ============================================================================
  # JOB 5: NOTIFICATIONS - Slack alerts and GitHub issue creation
  # Sends test results to Slack webhook (if configured)
  # Creates GitHub issue on test failures for tracking
  # Provides quick visibility into pipeline health
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, coverage]
    if: always()
    timeout-minutes: 5
    permissions:
      issues: write

    env:
      SLACK_WEBHOOK_CHECK: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Determine build status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "status=✅ All tests passed" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Some tests failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        if: env.SLACK_WEBHOOK_CHECK != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "Test Automation Pipeline: ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Actions Build*\n${{ steps.status.outputs.status }}\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Details"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        continue-on-error: true

      - name: Create GitHub Issue on Failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 CI/CD Pipeline Failed - ${context.sha.substring(0, 7)}`,
              body: `**Build Failed** on branch \`${context.ref}\`\n\n[View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            });
        continue-on-error: true
