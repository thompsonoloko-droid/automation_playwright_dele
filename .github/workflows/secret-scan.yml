name: Secret Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  detect-secrets:
    name: Detect Secrets (all files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: python -m pip install --upgrade pip detect-secrets

      - name: Run detect-secrets (scan all files)
        run: |
          detect-secrets scan --all-files > .secrets.current || true
          # Compare with committed baseline if present
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets.current --baseline .secrets.baseline || (echo 'Secrets changes detected' && exit 1)
          else
            echo 'No baseline found; upload .secrets.current as artifact for review'
            exit 0
          fi

      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-scan
          path: .secrets.current
