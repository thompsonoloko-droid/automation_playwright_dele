# GitHub Actions workflow for manual on-demand test execution
# Allows QA teams to trigger specific test suites with custom parameters
# Supports multiple test suites, browsers, and execution modes
# Generates comprehensive reports and Slack notifications

name: Manual Test Run

# Workflow trigger: Manual dispatch from GitHub Actions UI (workflow_dispatch)
# Allows users to provide inputs via web form when triggering manually
on:
  workflow_dispatch:
    inputs:
      # Test suite selection - determines which tests to run
      test_suite:
        description: "Test suite to run"
        required: true
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
          - ui-only
          - high-priority
      # Browser selection - which browser to test with
      browser:
        description: "Browser to test"
        required: true
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all-browsers
      # Execution mode - enable parallel test execution for faster runs
      parallel:
        description: "Run tests in parallel"
        required: false
        type: boolean
        default: true
      # Retry configuration - auto-retry flaky tests N times
      retry:
        description: "Number of retries for flaky tests"
        required: false
        type: choice
        options:
          - 0
          - 1
          - 2
          - 3
        default: "1"
      # Browser visibility mode - run headless or with UI
      headless:
        description: "Run in headless mode"
        required: false
        type: boolean
        default: true
      # Target environment for tests (staging, prod, etc.)
      slug:
        description: "Test environment slug (e.g., staging, prod)"
        required: false
        default: "staging"

jobs:
  # PRIMARY JOB: Build dynamic pytest command and execute tests
  # Dynamically constructs the pytest command based on user-provided inputs
  # Generates HTML, JUnit, and Allure reports
  run-tests:
    name: ${{ github.event.inputs.test_suite }} Tests - ${{ github.event.inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Selectively install only the specified browser(s) to optimize setup time
          # Uses playwright install with specific browser or all if "all-browsers" selected
          if [ "${{ github.event.inputs.browser }}" = "all-browsers" ]; then
            playwright install --with-deps
          else
            playwright install ${{ github.event.inputs.browser }} --with-deps
          fi

      # STEP: Build pytest command dynamically based on user inputs
      # Supports: all, smoke, regression, api, ui-only, high-priority
      # Outputs complete command to GITHUB_OUTPUT for use in subsequent steps
      - name: Build pytest command
        id: pytest-cmd
        run: |
          CMD="pytest"

          # Select test path and markers based on test suite choice
          # This switch statement determines which tests to run
          case "${{ github.event.inputs.test_suite }}" in
            smoke)
              CMD="$CMD tests/ui/ -m smoke"
              ;;
            regression)
              CMD="$CMD tests/ui/ -m regression"
              ;;
            api)
              CMD="$CMD tests/api/"
              ;;
            ui-only)
              CMD="$CMD tests/ui/"
              ;;
            high-priority)
              CMD="$CMD tests/ -m 'smoke or api'"
              ;;
            *)
              CMD="$CMD tests/"
              ;;
          esac

          # Build base pytest command with verbosity and short traceback format
          CMD="$CMD -v --tb=short"
          # Add browser specification if not running all browsers
          # (all-browsers is handled by running command three times)
          if [ "${{ github.event.inputs.browser }}" != "all-browsers" ]; then
            CMD="$CMD --browser=${{ github.event.inputs.browser }}"
          fi

          # Enable pytest-xdist plugin for parallel execution across CPU cores
          # Significantly speeds up test execution when parallel=true
          if [ "${{ github.event.inputs.parallel }}" = "true" ]; then
            CMD="$CMD -n auto"
          fi

          # Generate test reports in multiple formats for comprehensive visibility
          # HTML: Human-readable detailed report with timestamps and logs
          # JUnit XML: CI/CD platform integration (GitHub, Jenkins, etc.)
          # Allure: Interactive dashboard with trends, analytics, and attachments
          BROWSER_TAG="${{ github.event.inputs.browser }}"
          if [ "$BROWSER_TAG" = "all-browsers" ]; then BROWSER_TAG="multi"; fi
          CMD="$CMD --html=reports/${{ github.event.inputs.test_suite }}-${BROWSER_TAG}.html"
          CMD="$CMD --self-contained-html"
          CMD="$CMD --junitxml=reports/junit-${{ github.event.inputs.test_suite }}-${BROWSER_TAG}.xml"
          CMD="$CMD --alluredir=reports/allure-results"

          echo "command=$CMD" >> $GITHUB_OUTPUT

      # STEP: Display the test configuration before execution
      # Helpful for debugging and verifying correct parameters were passed
      - name: Display test configuration
        run: |
          echo "🧪 Test Configuration"
          echo "===================="
          echo "Suite: ${{ github.event.inputs.test_suite }}"
          echo "Browser: ${{ github.event.inputs.browser }}"
          echo "Parallel: ${{ github.event.inputs.parallel }}"
          echo "Retries: ${{ github.event.inputs.retry }}"
          echo "Headless: ${{ github.event.inputs.headless }}"
          echo "Environment: ${{ github.event.inputs.slug }}"
          echo ""
          echo "Command: ${{ steps.pytest-cmd.outputs.command }}"

      # STEP: Execute the dynamically built pytest command
      # continue-on-error allows subsequent steps to run even if tests fail
      # Environment variables are set here for test scenarios
      - name: Run tests
        run: ${{ steps.pytest-cmd.outputs.command }}
        env:
          HEADLESS: ${{ github.event.inputs.headless }}
          ENVIRONMENT: ${{ github.event.inputs.slug }}
        continue-on-error: true

      # STEP: Store test reports and logs as GitHub artifacts for later review
      # Encrypted and isolated per workflow run
      # Expires after 30 days by default
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.test_suite }}-${{ github.event.inputs.browser }}
          path: |
            reports/
            logs/
          retention-days: 30

  # SECONDARY JOB: Merge and consolidate all test reports
  # Runs after run-tests completes, downloads all artifacts and merges reports
  # Creates final consolidated test report
  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      # STEP: Download all artifacts generated from run-tests job
      # Artifacts are stored in all-artifacts/ directory for processing
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      # STEP: Consolidate all test results from different browsers/suites into single reports
      # Copies Allure results and HTML reports to final-reports directory
      # Enables centralized viewing of all test results
      - name: Merge test results
        run: |
          mkdir -p final-reports/allure-results
          find all-artifacts -name "allure-results" -type d -exec cp -r {}/* final-reports/allure-results/ \;
          find all-artifacts -name "*.html" -exec cp {} final-reports/ \;

      # STEP: Archive final consolidated reports
      # Available for download from GitHub Actions UI for 30 days
      - name: Upload final reports
        uses: actions/upload-artifact@v4
        with:
          name: test-report-final
          path: final-reports/
          retention-days: 30

      # STEP: Generate a summary visible in GitHub Actions UI and workflow run emails
      # Displays test configuration and links to detailed results
      # Provides quick overview of test run status
      - name: Create job summary
        run: |
          echo "# Manual Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Suite**: ${{ github.event.inputs.test_suite }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser**: ${{ github.event.inputs.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel**: ${{ github.event.inputs.parallel }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Retries**: ${{ github.event.inputs.retry }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "✅ Test reports and logs available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[📊 View Full Results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # FINAL JOB: Send status notification to Slack (if configured)
  # Optional notification only runs if SLACK_WEBHOOK_URL secret is configured
  # Provides on-demand testing feedback to team
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: generate-report
    if: always()

    steps:
      # STEP: Send Slack notification with test run results
      # Only executes if SLACK_WEBHOOK_URL secret is configured in repository
      # Includes links to action run for quick access to full results
      - name: Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Manual Test Run Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Manual Test Run Results*\n\nSuite: `${{ github.event.inputs.test_suite }}`\nBrowser: `${{ github.event.inputs.browser }}`\nStatus: Complete\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Full Details>"
                  }
                }
              ]
            }
        continue-on-error: true
