name: Scheduled Smoke Tests

on:
  schedule:
    # Run smoke tests every 6 hours
    - cron: "0 */6 * * *"
    # Run at 9 PM daily for night report
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  smoke-tests:
    name: Smoke Tests - ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install ${{ matrix.browser }} --with-deps

      - name: Run smoke tests (${{ matrix.browser }})
        run: |
          pytest tests/ui/ -m smoke \
            --browser=${{ matrix.browser }} \
            -v \
            --tb=short \
            --timeout=30 \
            --reruns=2 \
            --reruns-delay=5 \
            --html=reports/smoke-${{ matrix.browser }}-${{ github.run_id }}.html \
            --self-contained-html \
            --junitxml=reports/junit-smoke-${{ matrix.browser }}.xml \
            --alluredir=reports/allure-results/smoke
        env:
          BASE_URL: ${{ secrets.BASE_URL_STAGING || 'https://automationexercise.com' }}
          TIMEOUT: 30000
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ matrix.browser }}
          path: reports/
          retention-days: 7

  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: always()

    steps:
      - name: Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "Scheduled Smoke Tests Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Scheduled Smoke Tests*\nStatus: ${{ needs.smoke-tests.result }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        continue-on-error: true

  report-summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Create summary
        run: |
          echo "# Scheduled Smoke Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Chromium: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Firefox: ✅" >> $GITHUB_STEP_SUMMARY
