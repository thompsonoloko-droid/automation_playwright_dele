# GitHub Actions workflow for continuous health monitoring via scheduled runs
# Triggers: Every 6 hours + daily at 9 PM UTC (helps detect flaky tests/environment issues)
# Features:
# - Multi-browser smoke testing (Chromium, Firefox)
# - Automatic retry for flaky tests (2 retries with 5-second delay)
# - Slack notifications on completion
# - Step timeout (30 seconds per test to catch hangs)
# - Detailed Allure reporting and HTML reports
# - 7-day artifact retention

name: Scheduled Smoke Tests

on:
  # Cron schedules for automated continuous testing
  schedule:
    # Every 6 hours = 4 times per day = regular health checks
    - cron: "0 */6 * * *"
    # Every day at 9 PM = morning report available for team
    - cron: "0 21 * * *"
  # Manual trigger for on-demand smoke test runs
  workflow_dispatch:
    inputs:
      # Allow manual override of target environment
      environment:
        description: "Environment to test"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# ============================================================================
# JOB 1: SMOKE-TESTS - Multi-browser smoke test execution
# Runs critical path smoke tests on Chromium and Firefox in parallel
# Auto-retries 2x for flaky tests with 5-second delays
# Generates reports with 30-second per-test timeout
# ============================================================================
jobs:
  smoke-tests:
    name: Smoke Tests - ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install ${{ matrix.browser }} --with-deps

      - name: Verify required secrets present
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_CVC: ${{ secrets.CARD_CVC }}
          CARD_EXPIRY_MONTH: ${{ secrets.CARD_EXPIRY_MONTH }}
          CARD_EXPIRY_YEAR: ${{ secrets.CARD_EXPIRY_YEAR }}
        run: |
          MISSING=0
          for v in TEST_USER_NAME TEST_USER_EMAIL TEST_USER_PASSWORD CARD_NAME CARD_NUMBER CARD_CVC CARD_EXPIRY_MONTH CARD_EXPIRY_YEAR; do
            if [ -z "${!v}" ]; then
              echo "MISSING: $v"
              MISSING=1
            else
              echo "FOUND: $v"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "One or more required secrets are missing. Please add them in repository Secrets."
            exit 1
          fi

      # STEP: Execute smoke tests with auto-retry and detailed reporting
      # --retries=2: Automatically retry failed tests twice (pytest-retry)
      # --timeout=120: Kill test if it takes longer than 120 seconds (catches hangs)
      - name: Run smoke tests (${{ matrix.browser }})
        run: |
          pytest tests/ui/ -m smoke \
            --browser=${{ matrix.browser }} \
            -v \
            --tb=short \
            --timeout=120 \
            --retries=2 \
            --html=reports/smoke-${{ matrix.browser }}-${{ github.run_id }}.html \
            --self-contained-html \
            --junitxml=reports/junit-smoke-${{ matrix.browser }}.xml \
            --alluredir=reports/allure-results/${{ matrix.browser }}
        env:
          TEST_USER_NAME: ${{ secrets.TEST_USER_NAME }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CARD_NAME: ${{ secrets.CARD_NAME }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_CVC: ${{ secrets.CARD_CVC }}
          CARD_EXPIRY_MONTH: ${{ secrets.CARD_EXPIRY_MONTH }}
          CARD_EXPIRY_YEAR: ${{ secrets.CARD_EXPIRY_YEAR }}
          BASE_URL: ${{ secrets.BASE_URL_STAGING || 'https://automationexercise.com' }}
          TIMEOUT: 30000
        continue-on-error: true

      # STEP: Store detailed test reports and logs as artifacts
      # Retained for 7 days for later review and analysis
      - name: Upload results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: reports-${{ matrix.browser }}
          path: |
            reports/smoke-${{ matrix.browser }}-${{ github.run_id }}.html
            reports/allure-results/${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # JOB 2: NOTIFY-SLACK - Send test results to team
  # Posts Slack notification with pass/fail status
  # Includes links to full test execution details
  # Only runs if SLACK_WEBHOOK_URL secret is configured
  # ============================================================================
  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: always()
    # 1. Map the secret to a job-level env variable to 'bridge' the context
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || '' }}

    steps:
      - name: Send Slack notification
        # 2. Check the env variable. This avoids the 'vars' vs 'secrets' linter conflict.
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "Scheduled Smoke Tests Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Scheduled Smoke Tests*\nStatus: ${{ needs.smoke-tests.result }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        continue-on-error: true

  # ============================================================================
  # JOB 3: REPORT-SUMMARY - Generate and publish test summary
  # Downloads artifacts from all test runs
  # Creates formatted summary visible in GitHub Actions UI
  # Provides quick overview of smoke test health status
  # ============================================================================
  report-summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: always()

    steps:
      # STEP: Download all test artifacts from smoke-tests job
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: all-reports/

      # STEP: Format and publish summary to GitHub Actions job summary view
      # Summary is visible in email notifications and Actions UI
      - name: Create summary
        run: |
          echo "# Scheduled Smoke Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "- Chromium: ✅" >> $GITHUB_STEP_SUMMARY
            echo "- Firefox: ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Chromium: ❌ (check logs)" >> $GITHUB_STEP_SUMMARY
            echo "- Firefox: ❌ (check logs)" >> $GITHUB_STEP_SUMMARY
          fi
