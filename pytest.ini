[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Core execution options
addopts = 
    --strict-markers
    --tb=short
    --maxfail=5
    -v
    --disable-warnings
    --color=yes

# HTML reporting (optional: --html=reports/test-report.html)
# Allure reporting (optional: --alluredir=./reports/allure-results)

# Test markers
markers =
    smoke: Critical path/smoke tests for core functionality
    regression: Regression test suite
    api: API integration tests
    ui: UI/E2E tests
    cart: Shopping cart functionality
    login: Authentication and login tests
    checkout: Checkout process tests
    slow: Tests that take longer to execute
    performance: Response time and page load performance tests
    skip_ci: Tests to skip in CI/CD pipeline

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output options
console_output_style = progress
junit_family = xunit2
